<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Details - Ontash Employee Portal</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Update Your Details</h1>
        <form action="/update_details" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" value="{{ employee.name }}" required>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" value="{{ employee.age }}">

            <label for="job_role">Job Role:</label>
            <input type="text" id="job_role" name="job_role" value="{{ employee.job_role }}">

            <label for="team">Team:</label>
            <input type="text" id="team" name="team" value="{{ employee.team }}">

            <button type="submit" class="btn">Save Changes</button>
        </form>
    </div>
</body>
</html>
